<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Приглашение 💕</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #ffd1dc 0%, #ff9eb5 50%, #ff6b9d 100%);
    overflow: hidden;
    color: #4a1d3f;
  }
  body { display: flex; align-items: center; justify-content: center; padding: 20px; }

  .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .heart {
    position: absolute; bottom: -50px; font-size: 24px;
    animation: float linear infinite; opacity: 0.7;
  }
  @keyframes float {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.8; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.5s ease;
    z-index: 1;
  }
  .screen.active { opacity: 1; pointer-events: auto; }

  .card {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px);
    border-radius: 28px;
    padding: 32px 24px;
    max-width: 420px; width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(255, 107, 157, 0.35);
    animation: pop 0.6s cubic-bezier(.2,1.3,.5,1);
  }
  @keyframes pop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  h1 { font-size: 26px; margin-bottom: 20px; line-height: 1.3; }
  h2 { font-size: 22px; margin-bottom: 20px; }
  p { font-size: 18px; margin-bottom: 20px; }

  .btn {
    display: block;
    width: 100%;
    padding: 16px 20px;
    margin: 10px 0;
    border: none;
    border-radius: 16px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    background: linear-gradient(135deg, #ff6b9d, #ff4081);
    color: white;
    box-shadow: 0 6px 20px rgba(255, 64, 129, 0.4);
  }
  .btn:active { transform: scale(0.96); }
  .btn.secondary {
    background: white;
    color: #ff4081;
    border: 2px solid #ff4081;
    box-shadow: none;
  }
  .btn.small {
    padding: 12px 16px;
    font-size: 16px;
  }

  #noBtn {
    transition: all 0.3s ease;
  }

  .sad { font-size: 60px; margin: 20px 0; }

  input[type="datetime-local"],
  input[type="text"] {
    width: 100%;
    padding: 14px;
    border: 2px solid #ff6b9d;
    border-radius: 12px;
    font-size: 16px;
    margin: 16px 0;
    background: white;
    color: #4a1d3f;
  }

  .theme-btn {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    text-align: left;
    padding: 14px 18px;
  }
  .theme-btn .emoji { font-size: 24px; margin-right: 12px; }

  .final-heart {
    font-size: 80px;
    animation: beat 1s ease-in-out infinite;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>

<!-- Экран 1: Приглашение -->
<div class="screen active" id="screen1">
  <div class="card">
    <h1>💖 Твой любимый муж<br>приглашает тебя на свидание 💖</h1>
    <p>Пойдёшь со мной?</p>
    <button class="btn" id="yesBtn">Да 💕</button>
    <button class="btn secondary" id="noBtn">Нет</button>
  </div>
</div>

<!-- Экран 1.5: Уговор -->
<div class="screen" id="screen1b">
  <div class="card">
    <div class="sad">🥺</div>
    <h2>Ты правда не хочешь идти со мной на свидание?</h2>
    <button class="btn" id="backBtn">Ладно, уговорил 😊</button>
  </div>
</div>

<!-- Экран 2: Выбор темы -->
<div class="screen" id="screen2">
  <div class="card">
    <h2>Ура! 🎉 Что будем делать?</h2>
    <button class="btn theme-btn" data-theme="Аквапарк 🏊‍♀️"><span class="emoji">🏊‍♀️</span> Аквапарк</button>
    <button class="btn theme-btn" data-theme="Роллы 🍣"><span class="emoji">🍣</span> Роллы</button>
    <button class="btn theme-btn" data-theme="Сериал 📺"><span class="emoji">📺</span> Сериал</button>
    <button class="btn theme-btn" data-theme="Прогулка пешком 🚶‍♀️"><span class="emoji">🚶‍♀️</span> Прогулка пешком</button>
    <button class="btn theme-btn" data-theme="Поездка на машине 🚗"><span class="emoji">🚗</span> Поездка на машине</button>
    <button class="btn theme-btn" id="customThemeBtn"><span class="emoji">✨</span> Свой вариант</button>
  </div>
</div>

<!-- Экран 2.5: Свой вариант -->
<div class="screen" id="screen2b">
  <div class="card">
    <h2>Напиши свой вариант ✨</h2>
    <input type="text" id="customThemeInput" placeholder="Например: кино, кафе, массаж...">
    <button class="btn" id="confirmCustomBtn">Отлично! 💕</button>
    <button class="btn secondary small" id="backToThemesBtn">Назад</button>
  </div>
</div>

<!-- Экран 3: Выбор времени -->
<div class="screen" id="screen3">
  <div class="card">
    <h2>Когда встретимся? 🕐</h2>
    <input type="datetime-local" id="dateTime">
    <button class="btn" id="confirmTimeBtn">Готово! 💕</button>
  </div>
</div>

<!-- Экран 4: Финал -->
<div class="screen" id="screen4">
  <div class="card">
    <div class="final-heart">💖</div>
    <h1>Люблю тебя!</h1>
    <p>Буду готов к этому времени! 🥰</p>
  </div>
</div>

<script>
  // ========== НАСТРОЙКИ TELEGRAM ==========
  const TELEGRAM_BOT_TOKEN = '8818498469:AAHJrkzNuxzmpM-lGNxtVsEaNZhHvE2Vjo8';
  const TELEGRAM_CHAT_ID = '869850863';
  // ========================================

  const chosen = { theme: '', date: '' };

  // Сердечки на фоне
  function spawnHearts() {
    const container = document.getElementById('hearts');
    const emojis = ['💖','💕','💗','💓','❤️','💘'];
    for (let i = 0; i < 15; i++) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      h.style.left = Math.random() * 100 + '%';
      h.style.animationDuration = (8 + Math.random() * 8) + 's';
      h.style.animationDelay = Math.random() * 10 + 's';
      h.style.fontSize = (18 + Math.random() * 20) + 'px';
      container.appendChild(h);
    }
  }
  spawnHearts();

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // Кнопка "Да"
  document.getElementById('yesBtn').addEventListener('click', function() {
    showScreen('screen2');
  });

  // Кнопка "Нет" - убегает
  let runCount = 0;
  const noBtn = document.getElementById('noBtn');
  
  function runAway() {
    runCount++;
    const maxX = window.innerWidth - noBtn.offsetWidth - 40;
    const maxY = window.innerHeight - noBtn.offsetHeight - 40;
    const x = Math.random() * maxX;
    const y = Math.random() * maxY;
    
    noBtn.style.position = 'fixed';
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
    noBtn.style.zIndex = '9999';
    
    // После 3 попыток — показываем экран уговора
    if (runCount >= 3) {
      setTimeout(() => {
        noBtn.style.position = '';
        noBtn.style.left = '';
        noBtn.style.top = '';
        showScreen('screen1b');
      }, 500);
    }
  }

  // Для компьютеров
  noBtn.addEventListener('mouseover', runAway);
  
  // Для мобильных
  noBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    runAway();
  });
  
  // Если всё-таки нажмут
  noBtn.addEventListener('click', function() {
    showScreen('screen1b');
  });

  // Кнопка "Ладно, уговорил"
  document.getElementById('backBtn').addEventListener('click', function() {
    runCount = 0;
    showScreen('screen1');
  });

  // Выбор темы
  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      if (this.id === 'customThemeBtn') {
        showScreen('screen2b');
      } else {
        chosen.theme = this.getAttribute('data-theme');
        showScreen('screen3');
      }
    });
  });

  // Подтверждение своего варианта
  document.getElementById('confirmCustomBtn').addEventListener('click', function() {
    const customText = document.getElementById('customThemeInput').value.trim();
    if (!customText) {
      alert('Напиши, что хочешь делать 🥰');
      return;
    }
    chosen.theme = customText + ' ✨';
    document.getElementById('customThemeInput').value = '';
    showScreen('screen3');
  });

  // Назад к темам
  document.getElementById('backToThemesBtn').addEventListener('click', function() {
    document.getElementById('customThemeInput').value = '';
    showScreen('screen2');
  });

  // Подтверждение времени
  document.getElementById('confirmTimeBtn').addEventListener('click', function() {
    const dt = document.getElementById('dateTime').value;
    if (!dt) {
      alert('Пожалуйста, выбери дату и время 🥰');
      return;
    }
    const dateObj = new Date(dt);
    chosen.date = dateObj.toLocaleString('ru-RU', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });

    sendTelegramNotification();
    showScreen('screen4');
  });

  async function sendTelegramNotification() {
    const message = `💕 *Новое свидание!* 💕\n\n` +
                    `🎯 *Тема:* ${chosen.theme}\n` +
                    `📅 *Когда:* ${chosen.date}\n\n` +
                    `Она согласилась! 🥰`;

    const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
    
    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: message,
          parse_mode: 'Markdown'
        })
      });
      
      if (!response.ok) {
        console.error('Telegram error:', await response.text());
      }
    } catch (error) {
      console.error('Failed to send notification:', error);
    }
  }
</script>

</body>
</html>
